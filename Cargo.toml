[package]
name = "ymux-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Relay server for yMux remote control: authenticates desktops and devices, relays frames, sends Web Push"
publish = false

[[bin]]
name = "ymux-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = { version = "0.7", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "std"] }
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
subtle = "2"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
url = "2"
# Pure-Rust TLS (ring + webpki roots): no OpenSSL, builds on Windows and musl.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
hmac = "0.12"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

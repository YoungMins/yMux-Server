# yMux server + Caddy, which gets and renews the TLS certificate by itself.
#
#   1. Point a DNS name at this machine; open ports 80 and 443.
#   2. cp .env.example .env   and set YMUX_DOMAIN (e.g. remote.example.com)
#   3. docker compose -f docker-compose.caddy.yml up -d --build
#   4. docker compose -f docker-compose.caddy.yml exec ymux-server ymux-server token
#
# The server is not published on the host here; only Caddy is.
services:
  ymux-server:
    image: ghcr.io/youngmins/ymux-server:latest
    build: .
    restart: unless-stopped
    environment:
      YMUX_SERVER_PUBLIC_URL: https://${YMUX_DOMAIN:?Set YMUX_DOMAIN in .env, e.g. remote.example.com (copy .env.example to .env)}
      YMUX_SERVER_TRUST_PROXY: "1"
    expose:
      - "11020"
    volumes:
      - ymux-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      YMUX_DOMAIN: ${YMUX_DOMAIN:?Set YMUX_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ymux-server
    logging: *logging

volumes:
  ymux-data:
  caddy-data:
  caddy-config:
